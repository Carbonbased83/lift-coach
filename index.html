h1{font-size:24px;margin:6px 0 2px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:16px;margin:0}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}

button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button:active{transform:scale(.97)}

function chart(points,label){
 if(points.length<2)return `<div class="empty sm">Log this exercise ${2-points.length} more time${points.length===1?'':'s'} to see a chart.</div>`;
 const W=360,H=180,P=34;const ys=points.map(p=>p.y),mn=Math.min(...ys),mx=Math.max(...ys),rg=(mx-mn)||1;
 const t0=points[0].t,t1=points[points.length-1].t,tr=(t1-t0)||1;
 const xy=points.map(p=>[P+(p.t-t0)/tr*(W-P-10),H-24-(p.y-mn)/rg*(H-44)]);
 const pl=xy.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="${P}" y1="${H-24}" x2="${W-6}" y2="${H-24}" stroke="#2a2f3a"/><line x1="${P}" y1="20" x2="${W-6}" y2="20" stroke="#2a2f3a" stroke-dasharray="3 4"/>
 <text x="2" y="24" fill="#9aa1b0" font-size="11">${Math.round(mx)}</text><text x="2" y="${H-20}" fill="#9aa1b0" font-size="11">${Math.round(mn)}</text>
 <polyline points="${pl}" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round"/>${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#4ade80"/>`).join('')}
 <text x="${P}" y="${H-6}" fill="#9aa1b0" font-size="11">${new Date(t0).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text x="${W-6}" y="${H-6}" fill="#9aa1b0" font-size="11" text-anchor="end">${new Date(t1).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text></svg>`;
}
function vProgress(){
 const ids=[...new Set(S.workouts.flatMap(w=>w.ex.map(e=>e.id)))];
 if(!ids.length)return `<h1>Progress</h1><div class="empty">Charts and PRs appear after your first logged workout.</div>`;
 if(!progEx||!ids.includes(progEx))progEx=ids[0];
 const ex=getEx(progEx),ss=sessionsFor(progEx);
 const pts=ss.map(s=>({t:s.t,y:ex.assist?Math.min(...s.sets.map(x=>x.w)):Math.max(...s.sets.map(x=>e1rm(x.w,x.r)))}));
 const rc=recommend(progEx);
 let h=`<h1>Progress</h1><select data-act="progSel">${ids.map(id=>`<option value="${id}" ${id===progEx?'selected':''}>${esc(getEx(id).name)}</option>`).join('')}</select>`;
 h+=`<div class="card"><div class="row"><h3>${ex.assist?'Assist weight (lower = stronger)':'Estimated 1-rep max'}</h3><span class="sp"></span><span class="xs mut">${unit()}</span></div>${chart(pts,ex.name)}
 <div class="sm" style="margin-top:6px">Next time: <b>${fmtW(rc.w)} ${unit()}</b> × ${ex.lo}–${ex.hi}<br><span class="xs mut">${esc(rc.reason)}</span></div></div>`;
 h+=`<div class="card"><h3>Sessions</h3><table><tr><th>Date</th><th>Sets</th><th>Best e1RM</th></tr>${ss.slice().reverse().slice(0,12).map(s=>`<tr><td class="sm">${new Date(s.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td><td class="sm">${s.sets.map(x=>fmtW(x.w)+'×'+x.r).join(', ')}</td><td>${Math.round(Math.max(...s.sets.map(x=>e1rm(x.w,x.r))))}</td></tr>`).join('')}</table></div>`;
 h+=`<h2>🏆 Personal records</h2><div class="card"><table><tr><th>Exercise</th><th>Best set</th><th>e1RM</th></tr>${ids.map(id=>{let best=null;for(const s of sessionsFor(id))for(const x of s.sets){if(!best||e1rm(x.w,x.r)>e1rm(best.w,best.r))best=x}return best&&!getEx(id).assist?`<tr><td class="sm">${esc(getEx(id).name)}</td><td>${fmtW(best.w)}×${best.r}</td><td>${Math.round(e1rm(best.w,best.r))}</td></tr>`:''}).join('')}</table></div>`;
 return h;
}

 <label class="row" style="margin-top:10px"><input type="checkbox" data-act="tog" data-v="vibrate" ${s.vibrate?'checked':''} style="width:22px;height:22px"> Vibrate when rest is done</label>

/* ====================== SHEETS ====================== */
function sheet(html){$('#sheet').innerHTML=html;$('#sheet').classList.add('show');$('#sheetBg').classList.add('show')}
function closeSheet(){$('#sheet').classList.remove('show');$('#sheetBg').classList.remove('show')}
function exListHtml(ids,act,extra){return ids.map(id=>{const e=getEx(id);const rc=recommend(id);return `<button class="li" data-act="${act}" data-id="${id}" ${extra||''}><div class="sp"><b>${esc(e.name)}</b>${e.caution?' <span class="badge y">caution: low back</span>':''}<div class="xs mut">${MUSCLES[e.m]?MUSCLES[e.m].n:''} · ${rc.isNew?'new':'next '+fmtW(rc.w)+' '+unit()}</div></div><span>›</span></button>`}).join('')}
let SWAP=null;
function openSwap(ctx,id){SWAP=ctx;const inUse=new Set(ctx.plan?buildPlan(todayDay()).map(x=>x.id):S.current.ex.map(x=>x.id));const alts=alternatives(id).filter(a=>!inUse.has(a));sheet(`<h3>Swap ${esc(getEx(id).name)}</h3><div class="xs mut">Same muscle group. Your choice is remembered for this slot.</div>${exListHtml(alts,'doSwap')||'<div class="empty">No alternatives</div>'}<button class="btn-big" data-act="closeSheet">Cancel</button>`)}
function openAdd(){const groups={};Object.values(LIB).concat(Object.values(S.custom)).filter(e=>listable(e.id)).forEach(e=>{(groups[e.m]=groups[e.m]||[]).push(e.id)});
 const focus=S.current?DAYS[S.current.day].m:[];const order=Object.keys(MUSCLES).sort((a,b)=>focus.includes(b)-focus.includes(a));
 sheet(`<h3>Add exercise</h3>${order.filter(m=>groups[m]).map(m=>`<div class="xs mut" style="margin-top:12px">${MUSCLES[m].n.toUpperCase()}</div>${exListHtml(groups[m],'doAdd')}`).join('')}
 <div class="card"><b>Custom exercise</b><input type="text" id="cName" placeholder="Name (e.g. Cable Y-raise)" style="margin-top:8px"><select id="cMus" style="margin-top:8px">${Object.keys(MUSCLES).map(m=>`<option value="${m}">${MUSCLES[m].n}</option>`).join('')}</select><button class="btn-p" style="width:100%;margin-top:8px" data-act="addCustom">Add custom</button></div>
 <button class="btn-big" data-act="closeSheet">Close</button>`)}
/* ====================== EVENTS ====================== */
function act(a,d,el){
 const c=S.current;
 switch(a){
 case 'nav':VIEW=d.v;closeSheet();window.scrollTo(0,0);render();break;
 case 'pickDay':S.dayOverride=d.v===nextDay()?null:d.v;save();render();break;
 case 'start':startWorkout(d.v);try{window.scrollTo(0,0)}catch(e){}render();ensureAudio();break;
 case 'setStart':{const e=getEx(d.id);const v=prompt('Starting weight for '+e.name+' ('+unit()+')',estOf(e));if(v!=null&&!isNaN(parseFloat(v))){S.startW[d.id]=parseFloat(v);save();render()}break}
 case 'swapPlan':openSwap({plan:true,slot:d.slot},d.id);break;
 case 'swap':openSwap({ei:+d.ei},c.ex[+d.ei].id);break;
 case 'doSwap':{if(SWAP.plan){S.prefs[SWAP.slot]=d.id}else{const old=c.ex[SWAP.ei];if(old.slot)S.prefs[old.slot]=d.id;const n=makeExLog({id:d.id,slot:old.slot,sets:old.sets.length,lo:getEx(d.id).lo,hi:getEx(d.id).hi,note:old.note});c.ex[SWAP.ei]=n}save();closeSheet();render();toast('Swapped to '+getEx(d.id).name);break}
 case 'adj':{const s=c.ex[+d.ei].sets[+d.si];const v=parseFloat(d.v);if(d.f==='w')s.w=Math.max(0,+(s.w+v).toFixed(2));else s.r=Math.max(0,s.r+v);
  // propagate weight change to later undone sets
  if(d.f==='w')c.ex[+d.ei].sets.forEach((x,i)=>{if(i>+d.si&&!x.done)x.w=s.w});save();render();break}
 case 'done':{const e=c.ex[+d.ei],s=e.sets[+d.si];s.done=!s.done;save();render();if(s.done){const allDone=c.ex.every(x=>x.sets.every(y=>y.done));if(!allDone)startRest(restFor(e.id));else{stopRest();toast('All sets done — tap Finish 💪')}}break}
 case 'addSet':{const e=c.ex[+d.ei];const l=e.sets[e.sets.length-1]||{w:recommend(e.id).w,r:e.lo};e.sets.push({w:l.w,r:l.r,done:false});save();render();break}
 case 'rmSet':{c.ex[+d.ei].sets.pop();save();render();break}
 case 'exMenu':{const ei=+d.ei;sheet(`<h3>${esc(getEx(c.ex[ei].id).name)}</h3><button class="li" data-act="moveEx" data-ei="${ei}" data-v="-1">↑ Move up</button><button class="li" data-act="moveEx" data-ei="${ei}" data-v="1">↓ Move down</button><button class="li btn-d" data-act="rmEx" data-ei="${ei}">✕ Remove from workout</button><button class="btn-big" data-act="closeSheet">Close</button>`);break}
 case 'moveEx':{const i=+d.ei,j=i+(+d.v);if(j>=0&&j<c.ex.length){[c.ex[i],c.ex[j]]=[c.ex[j],c.ex[i]];save()}closeSheet();render();break}
 case 'rmEx':c.ex.splice(+d.ei,1);save();closeSheet();render();break;
 case 'addEx':openAdd();break;
 case 'doAdd':{const e=getEx(d.id);c.ex.push(makeExLog({id:d.id,sets:3,lo:e.lo,hi:e.hi}));save();closeSheet();render();setTimeout(()=>{const el=$('#ex'+(c.ex.length-1));el&&el.scrollIntoView({behavior:'smooth'})},50);break}
 case 'addCustom':{const n=$('#cName').value.trim();if(!n){toast('Enter a name');break}const id='c_'+uid();S.custom[id]={id,name:n,m:$('#cMus').value,sec:[],inc:5,lo:8,hi:12,est:20,custom:true};c.ex.push(makeExLog({id,sets:3,lo:8,hi:12}));save();closeSheet();render();break}
 case 'rest':startRest();break;
 case 'cardioSkip':c.cardioSkip=true;c.cardio=null;save();render();break;
 case 'tadj':T.end+=parseInt(d.v)*1000;T.fired=false;$('#timer').className='show';tick();break;
 case 'tskip':stopRest();break;
 case 'finish':{const dn=c.ex.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);if(!dn){if(!confirm('No sets marked done. Discard this workout?'))break}else if(dn<c.ex.reduce((a,e)=>a+e.sets.length,0)&&!confirm('Some sets are not marked done — they will not be saved. Finish anyway?'))break;
  stopRest();const r=finishWorkout();render();if(r&&!r.empty){const v=volume(r.w);sheet(`<h1>Workout saved 💪</h1><div class="mut">${r.w.ex.length} exercises · ${v.n} sets · ${Math.round(v.v).toLocaleString()} ${unit()} · ${Math.round((r.w.end-r.w.start)/60000)} min</div>${r.prs.length?`<h2>🏆 New PRs</h2>${r.prs.map(p=>`<div class="pr sm">${esc(p)}</div>`).join('')}`:''}<h2>Next up: ${DAYS[nextDay()].n}</h2><div class="sm mut">Weights for next time are already updated from today's reps.</div><button class="btn-p btn-big" style="margin-top:12px" data-act="closeSheet">Done</button>`)}break}
 case 'discard':if(confirm('Discard this workout? Nothing will be saved.')){S.current=null;stopRest();save();render()}break;
 case 'toggleHist':openHist=openHist===d.v?null:d.v;render();break;
 case 'delHist':if(confirm('Delete this workout from history?')){S.workouts=S.workouts.filter(w=>w.id!==d.v);save();render()}break;
 case 'unit':if(d.v!==S.settings.unit){const conv=S.workouts.length||S.current?confirm('Convert your logged weights to '+d.v+' too?'):false;const f=d.v==='kg'?1/2.2046:2.2046;
  if(conv){const cv=w=>Math.round(w*f*2)/2;S.workouts.forEach(w=>w.ex.forEach(e=>e.sets.forEach(s=>s.w=cv(s.w))));if(S.current)S.current.ex.forEach(e=>e.sets.forEach(s=>s.w=cv(s.w)));for(const k in S.startW)S.startW[k]=cv(S.startW[k])}
  S.settings.unit=d.v;save();render()}break;
 case 'rot':{const r=S.settings.rotation,i=+d.i,j=i+(+d.v);[r[i],r[j]]=[r[j],r[i]];save();render();break}
 case 'len':S.settings.length=d.v;save();render();break;
 case 'setVal':S.settings[d.k]=d.v;save();render();break;
 case 'restAdj':S.settings.rest=Math.max(15,Math.min(600,S.settings.rest+parseInt(d.v)));save();render();break;
 case 'export':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='lift-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded');break}
 case 'copyExport':{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard'),()=>{sheet(`<h3>Copy this JSON</h3><textarea style="width:100%;height:40vh;background:#111;color:#ddd">${esc(t)}</textarea><button class="btn-big" data-act="closeSheet">Close</button>`)});break}
 case 'import':$('#importFile').click();break;
 case 'reset':if(confirm('Delete ALL workouts and settings? Export a backup first if unsure.')&&confirm('Really reset? This cannot be undone.')){S=defaults();save();VIEW='today';render();toast('Reset done')}break;
 case 'closeSheet':closeSheet();break;
 case 'memDismiss':S.memDismissed=true;render();break;
 }

function importData(txt){const o=JSON.parse(txt);if(!o||!Array.isArray(o.workouts))throw new Error('Not a Lift Coach backup');S=Object.assign(defaults(),o,{settings:Object.assign(defaults().settings,o.settings||{})});save();}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;if(el.id==='sheetBg'&&ev.target!==el)return;try{act(el.dataset.act,el.dataset,el)}catch(e){showErr(e);try{render()}catch(_){}}});
document.addEventListener('change',ev=>{try{onChange(ev)}catch(e){showErr(e)}});
function onChange(ev){const el=ev.target;const d=el.dataset;
 if(d.act==='inp'&&S.current){const s=S.current.ex[+d.ei].sets[+d.si];const v=parseFloat(el.value);if(!isNaN(v)){if(d.f==='w'){s.w=Math.max(0,v);S.current.ex[+d.ei].sets.forEach((x,i)=>{if(i>+d.si&&!x.done)x.w=s.w})}else s.r=Math.max(0,Math.round(v))}save();render()}
 else if(d.act==='cardioMin'&&S.current){const v=parseInt(el.value);S.current.cardio=v>0?v:null;save()}
 else if(d.act==='startW'){const v=parseFloat(el.value);if(isNaN(v))delete S.startW[d.id];else S.startW[d.id]=v;save()}
 else if(d.act==='incSel'){S.incOv[d.id]=parseFloat(el.value);save()}
 else if(d.act==='progSel'){progEx=el.value;render()}
 else if(d.act==='tog'){S.settings[d.v]=el.checked;save();render()}
 else if(el.id==='importFile'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{if(confirm('Replace current data with this backup?')){importData(fr.result);render();toast('Imported '+S.workouts.length+' workouts')}}catch(e){toast('Import failed: '+e.message)}el.value=''};fr.readAsText(el.files[0])}}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.act==='inp')setTimeout(()=>e.target.select(),0)});
setInterval(()=>{const el=$('#elapsed');if(el&&S.current)el.textContent=Math.floor((Date.now()-S.current.start)/60000)},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.end)tick()});
