:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2a2f3a;--tx:#e8eaf0;--mut:#9aa1b0;--acc:#4ade80;--acc2:#22c55e;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--r:14px}

html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.timing{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 12px 16px}

button{font:inherit;color:inherit;background:var(--card2);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button:active{transform:scale(.97)}
.btn-p{background:var(--acc2);border-color:var(--acc2);color:#04120a;font-weight:700}
.btn-big{width:100%;min-height:54px;font-size:18px}
.btn-d{color:var(--bad)}
.btn-s{min-height:36px;padding:0 10px;font-size:14px}
.chip{min-height:40px;border-radius:20px;padding:0 16px}
.chip.on{background:var(--acc2);color:#04120a;border-color:var(--acc2);font-weight:700}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px;background:#1e3a8a;color:#bfdbfe;vertical-align:middle}
.badge.g{background:#14532d;color:#bbf7d0}.badge.y{background:#713f12;color:#fde68a}.badge.r{background:#7f1d1d;color:#fecaca}

.bar{height:10px;border-radius:5px;background:var(--card2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:5px}
.ex-h{display:flex;gap:8px;align-items:flex-start}

.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.tip{background:var(--card2);border-radius:10px;padding:8px 10px;margin:8px 0;border-left:3px solid var(--blue)}
.tip b{font-size:14px}.tip .sm{margin-top:2px}
.tcard h3{display:flex;align-items:center;gap:6px}
.vs{font-size:12px;font-weight:700;white-space:nowrap}.vs.up{color:var(--acc)}.vs.dn{color:var(--bad)}
.stat{flex:1;background:var(--card2);border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:20px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;flex:none}
.pcard{display:flex;gap:12px;align-items:center;padding:12px 14px;min-height:78px;width:100%;text-align:left}

function fatigue(now=Date.now()){

  for(const e of w.ex){const ex=getEx(e.id);const n=doneSets(e).length;if(!n)continue;

function obRead(){const a=OB.a,st=OB_STEPS[OB.i];
 if(st==='name'){const n=$('#obName');if(n)a.name=n.value.trim().slice(0,24);const p=$('#obPin');if(p)a.pin=p.value.trim()}
 if(st==='bw'){const b=$('#obBw');if(b)a.bw=b.value.trim()}
 if(st==='startw')document.querySelectorAll('[data-sw]').forEach(i=>{const v=parseFloat(i.value);if(v>0)a.startW[i.dataset.sw]=v;else delete a.startW[i.dataset.sw]})}
function obGo(d){OB.i=Math.max(0,Math.min(OB_STEPS.length-1,OB.i+d));try{window.scrollTo(0,0)}catch(e){}render()}
function obAct(a,d){const A=OB&&OB.a;switch(a){
 case 'obPick':{let v=d.v;if(d.k==='len')v=+v;if(d.k==='cardio')v=v==='1';A[d.k]=v;obGo(1);break}
 case 'obTog':{const o=A[d.k];if(d.k==='limits'&&d.v==='none'){A.limits=o.none?{}:{none:true}}else{o[d.v]=!o[d.v];if(d.k==='limits')delete o.none}render();break}
 case 'obNext':{obRead();const st=OB_STEPS[OB.i];
  if(st==='name'){if(!A.name){toast('Please enter a name');break}if(A.pin&&!/^\d{4}$/.test(A.pin)){toast('PIN must be exactly 4 digits (or leave it empty)');break}}
  if(st==='bw'&&A.bw&&!(parseFloat(A.bw)>0&&parseFloat(A.bw)<1500)){toast('Enter a valid weight or tap Skip');break}
  obGo(1);break}
 case 'obSkip':{const st=OB_STEPS[OB.i];if(st==='startw')A.startW={};else if(st==='bw')A.bw='';else if(st==='equip')A.equip={machines:true,cables:true,dumbbells:true,bodyweight:true};else if(st==='limits')A.limits={none:true};else{const k={exp:'exp',split:'split',cardio:'cardio',abs:'abs',units:'unit'}[st];if(k&&A[k]==null)A[k]=OB_DEF[k]}obGo(1);break}
 case 'obBack':obRead();if(OB.i===0)obAct('obCancel',d);else obGo(-1);break;
 case 'obCancel':if(OB.redo){OB=null;VIEW='settings';render()}else{OB=null;VIEW='profiles';render()}break;
 case 'obFinish':{const a2=OB.a;
  if(OB.redo){const p=profById(PROF.last);if(p&&a2.name)p.name=a2.name;applyAnswers(S,a2,false);addBw(S,a2.bw);save();saveProfiles();OB=null;VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();toast('Plan updated — your history is kept');break}
  const used=PROF.list.map(p=>p.color);const p={id:'p'+uid(),name:a2.name||'Me',color:AV_COL.find(c=>!used.includes(c))||AV_COL[PROF.list.length%AV_COL.length],created:Date.now()};if(a2.pin)p.pin=a2.pin;
  const s=applyAnswers(defaults(true),a2,true);addBw(s,a2.bw);s.onboarded=Date.now();
  PROF.list.push(p);PROF.last=p.id;KEY=profKey(p);S=s;save();saveProfiles();OB=null;VIEW='today';progEx=null;openHist=null;openTpl=null;progTab='lifts';try{window.scrollTo(0,0)}catch(e){}render();toast('Welcome, '+p.name+'! Your plan is ready 💪');break}
 default:return false}
 return true}

 case 'setProg':if(PROGS[d.v]&&S.program!==d.v){S.program=d.v;S.dayOverride=null;save();toast('Program: '+PROGS[d.v].n+(PROGS[d.v].list?' · next up '+PRE[nextTpl()].n:''))}render();break;
 case 'tplOpen':openTpl=openTpl===d.v?null:d.v;render();break;
 case 'startTpl':if(S.current){toast('Finish or discard the workout in progress first');break}startWorkout(PRE[d.v].day,d.v);VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();ensureAudio();break;
 case 'todayTpl':S.dayOverride='tpl:'+d.v;save();VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();toast(PRE[d.v].n+' set for today');break;
 case 'addTpl':{if(!c){toast('Start a workout first');break}const have=new Set(c.ex.map(x=>x.id));const add=buildTplPlan(d.v).filter(p=>!have.has(p.id));add.forEach(p=>c.ex.push(makeExLog(p)));save();closeSheet();render();toast(add.length?'Added '+add.length+' exercises':'Already in this workout');if(add.length)setTimeout(()=>{const el=$('#ex'+(c.ex.length-add.length));el&&el.scrollIntoView({behavior:'smooth'})},50);break}
 case 'allTips':sheet(`<h3>Coach tips</h3><div class="xs mut">Rules run on your own logs on this phone — not a live AI.</div>${coachTips().map(tipHtml).join('')}<button class="btn-big" data-act="closeSheet" style="margin-top:8px">Close</button>`);break;
 case 'progTab':progTab=d.v;render();break;
 case 'metric':progMetric=d.v;render();break;
 case 'bwAdd':{const el2=$('#bwIn');const v=parseFloat(el2&&el2.value);if(!(v>0)||v>1500){toast('Enter your weight in '+unit());break}const t=Date.now(),day0=new Date(t).toDateString();S.body=(S.body||[]).filter(b=>new Date(b.t).toDateString()!==day0);S.body.push({t,w:Math.round(v*10)/10});S.body.sort((a,b)=>a.t-b.t);save();render();toast('Saved '+fmtW(v)+' '+unit());break}
 case 'bwDel':if(confirm('Delete this bodyweight entry?')){S.body=(S.body||[]).filter(b=>String(b.t)!==d.v);save();render()}break;
 }
}
function importData(txt){const o=JSON.parse(txt);if(!o||!Array.isArray(o.workouts))throw new Error('Not a Lift Coach backup');S=migrate(Object.assign(defaults(o.noSeed),o,{settings:Object.assign(defaults(o.noSeed).settings,o.settings||{})}));save();}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;if(el.id==='sheetBg'&&ev.target!==el)return;try{act(el.dataset.act,el.dataset,el)}catch(e){showErr(e);try{render()}catch(_){}}});
document.addEventListener('change',ev=>{try{onChange(ev)}catch(e){showErr(e)}});
function onChange(ev){const el=ev.target;const d=el.dataset;
 if(d.act==='inp'&&S.current){const s=S.current.ex[+d.ei].sets[+d.si];const v=parseFloat(el.value);if(!isNaN(v)){if(d.f==='w'){s.w=Math.max(0,v);S.current.ex[+d.ei].sets.forEach((x,i)=>{if(i>+d.si&&!x.done)x.w=s.w})}else s.r=Math.max(0,Math.round(v))}save();render()}
 else if(d.act==='cardioMin'&&S.current){const v=parseInt(el.value);S.current.cardio=v>0?v:null;save()}
 else if(d.act==='startW'){const v=parseFloat(el.value);if(isNaN(v))delete S.startW[d.id];else S.startW[d.id]=v;save()}
 else if(d.act==='incSel'){S.incOv[d.id]=parseFloat(el.value);save()}
 else if(d.act==='progSel'){progEx=el.value;render()}
 else if(d.act==='volSel'){volMus=el.value;render()}
 else if(d.act==='tog'){S.settings[d.v]=el.checked;if(d.v==='backFriendly'&&el.checked){S.settings.limits=S.settings.limits||{};S.settings.limits.back=true}save();render()}
 else if(d.act==='setSel'){S.settings[d.v]=el.value;save();render()}
 else if(d.act==='limTog'){const L=S.settings.limits=S.settings.limits||{};if(el.checked)L[d.v]=true;else delete L[d.v];if(d.v==='back')S.settings.backFriendly=el.checked;save();render()}
 else if(el.id==='importFile'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{if(confirm('Replace current data with this backup?')){importData(fr.result);render();toast('Imported '+S.workouts.length+' workouts')}}catch(e){toast('Import failed: '+e.message)}el.value=''};fr.readAsText(el.files[0])}}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.act==='inp')setTimeout(()=>e.target.select(),0)});
setInterval(()=>{const el=$('#elapsed');if(el&&S.current)el.textContent=Math.floor((Date.now()-S.current.start)/60000)},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.end)tick()});
