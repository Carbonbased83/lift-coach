function obRead(){const a=OB.a,st=obSteps()[OB.i];
 if(st==='name'){const n=$('#obName');if(n)a.name=n.value.trim().slice(0,24);const p=$('#obPin');if(p)a.pin=p.value.trim()}
 if(st==='bw'){const b=$('#obBw');if(b)a.bw=b.value.trim()}
 if(st==='homeeq'){const x=$('#obDbMax');if(x)a.home.dbMax=x.value.trim();const y=$('#obKbMax');if(y)a.home.kbMax=y.value.trim()}
 if(st==='startw')document.querySelectorAll('[data-sw]').forEach(i=>{const v=parseFloat(i.value);if(v>0)a.startW[i.dataset.sw]=v;else delete a.startW[i.dataset.sw]})}

 case 'obPick':{if(d.k.indexOf('po_')===0){A.po=A.po||JSON.parse(JSON.stringify(OB_PO_DEF));A.po[d.k.slice(3)]=d.v;obGo(1);break}if(d.k==='path'){const was=A.path;A.path=d.v;if(!OB.redo&&d.v==='beginner')A.equip={machines:true,cables:false,dumbbells:false,bodyweight:true};else if(!OB.redo&&was==='beginner')A.equip={machines:true,cables:true,dumbbells:true,bodyweight:true};obGo(1);break}let v=d.v;if(d.k==='len')v=+v;if(d.k==='cardio'||d.k==='game')v=v==='1';A[d.k]=v;obGo(1);break}
 case 'obTog':{obRead();if(d.k.indexOf('po_')===0){A.po=A.po||JSON.parse(JSON.stringify(OB_PO_DEF));const kk=d.k.slice(3),o=A.po[kk]=Object.assign({},A.po[kk]||{});if(kk==='athEq'&&d.v==='none')A.po.athEq=o.none?{}:{none:true};else{o[d.v]=!o[d.v];delete o.none}render();break}const o=A[d.k];if(d.k==='home'){if(d.v==='none'){const was=o.none;HQ.forEach(([k])=>o[k]=false);o.none=!was}else{o[d.v]=!o[d.v];o.none=false}render();break}if(d.k==='limits'&&d.v==='none'){A.limits=o.none?{}:{none:true}}else{o[d.v]=!o[d.v];if(d.k==='limits')delete o.none}render();break}
 case 'obSub':{obRead();const h=A.home;if(d.k==='ck'){h.ck=h.ck||{};h.ck[d.v]=!h.ck[d.v]}else if(d.k==='bandLoop')h.bandLoop=h.bandLoop===false;else if(d.k==='bandHandle')h.bandHandle=!h.bandHandle;else h[d.k]=d.v;render();break}
 case 'obPo':{A.po=A.po||JSON.parse(JSON.stringify(OB_PO_DEF));A.po[d.k]=d.k==='cmin'?+d.v:d.v;render();break}
 case 'obNext':{obRead();const st=obSteps()[OB.i];
  if(st==='name'){if(!A.name){toast('Please enter a name');break}if(A.pin&&!/^\d{4}$/.test(A.pin)){toast('PIN must be exactly 4 digits (or leave it empty)');break}}
  if(st==='homeeq'&&!HQ.some(([k])=>A.home[k])){toast('Tick what you have, or “Nothing — bodyweight only”');break}
  if(st==='bw'&&A.bw&&!(parseFloat(A.bw)>0&&parseFloat(A.bw)<1500)){toast('Enter a valid weight or tap Skip');break}
  obGo(1);break}
 case 'obSkip':{const st=obSteps()[OB.i];if(st==='path')A.path=A.path||'standard';else if(st==='game')A.game=false;else if(st==='age')A.age='';else if(st==='where')A.where=A.where||'gym';else if(st==='homeeq'){if(!HQ.some(([k])=>A.home[k]))A.home.none=true}else if(st==='startw')A.startW={};else if(st==='bw')A.bw='';else if(st==='equip')A.equip={machines:true,cables:true,dumbbells:true,bodyweight:true};else if(st==='limits')A.limits={none:true};else{const k={exp:'exp',split:'split',cardio:'cardio',abs:'abs',units:'unit'}[st];if(k&&A[k]==null)A[k]=OB_DEF[k]}obGo(1);break}

  if(OB.redo){const p=profById(PROF.last);if(p&&a2.name)p.name=a2.name;applyAnswers(S,a2,false);addBw(S,a2.bw);save();saveProfiles();OB=null;VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();toast('Plan updated — your history is kept');break}

 case 'toggleHist':openHist=openHist===d.v?null:d.v;render();break;
 case 'delHist':if(confirm('Delete this workout from history?')){S.workouts=S.workouts.filter(w=>w.id!==d.v);save();render()}break;
 case 'unit':if(d.v!==S.settings.unit){const conv=S.workouts.length||S.current?confirm('Convert your logged weights to '+d.v+' too?'):false;const f=d.v==='kg'?1/2.2046:2.2046;
  if(conv){const cv=w=>Math.round(w*f*2)/2;(S.body||[]).forEach(b=>b.w=Math.round(b.w*f*10)/10);const nb=id=>!(LIB[id]||{}).band;S.workouts.forEach(w=>w.ex.forEach(e=>{if(nb(e.id))e.sets.forEach(s=>s.w=cv(s.w))}));if(S.current)S.current.ex.forEach(e=>{if(nb(e.id))e.sets.forEach(s=>s.w=cv(s.w))});for(const k in S.startW)if(nb(k))S.startW[k]=cv(S.startW[k]);{const h=S.settings.homeEq;if(h){if(h.dbMax)h.dbMax=cv(h.dbMax);if(h.kbMax)h.kbMax=cv(h.kbMax)}}}
  S.settings.unit=d.v;save();render()}break;
 case 'rot':{const r=S.settings.rotation,i=+d.i,j=i+(+d.v);[r[i],r[j]]=[r[j],r[i]];save();render();break}
 case 'len':S.settings.length=d.v;save();render();break;
 case 'setVal':S.settings[d.k]=d.v;save();render();break;
 case 'restAdj':S.settings.rest=Math.max(15,Math.min(600,S.settings.rest+parseInt(d.v)));save();render();break;
 case 'export':{const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='lift-coach-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Backup downloaded');break}
 case 'copyExport':{const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copied to clipboard'),()=>{sheet(`<h3>Copy this JSON</h3><textarea style="width:100%;height:40vh;background:#111;color:#ddd">${esc(t)}</textarea><button class="btn-big" data-act="closeSheet">Close</button>`)});break}
 case 'import':$('#importFile').click();break;
 case 'reset':if(confirm('Delete ALL of this profile\'s workouts and settings? Other profiles are not affected. Export a backup first if unsure.')&&confirm('Really reset? This cannot be undone.')){const ns=!!S.noSeed;S=defaults(ns);save();if(ns)obStart(true);else{VIEW='today';render()}toast('Reset done')}break;
 case 'closeSheet':closeSheet();break;
 case 'sumDone':{closeSheet();const p=String(d.v).split('-');$('#lvl').innerHTML=levelUpHtml(+p[0],+p[1]);$('#lvl').classList.add('show');break}
 case 'lvlClose':$('#lvl').classList.remove('show');$('#lvl').innerHTML='';break;
 case 'gameOn':S.settings.game=true;S.game=S.game||{};S.game.seenLv=gameLedger().lv.l;save();render();break;
 case 'placeSave':placeSave();break;
 case 'memDismiss':S.memDismissed=true;render();break;
 case 'pickTpl':S.dayOverride=d.v===nextTpl()?null:'tpl:'+d.v;save();render();break;
 case 'clearPick':S.dayOverride=null;save();render();break;
 case 'setProg':if(PROGS[d.v]&&S.program!==d.v){S.program=d.v;S.dayOverride=null;save();toast('Program: '+PROGS[d.v].n+(PROGS[d.v].list?' · next up '+PRE[nextTpl()].n:''))}render();break;
 case 'tplOpen':openTpl=openTpl===d.v?null:d.v;render();break;
 case 'startTpl':if(S.current){toast('Finish or discard the workout in progress first');break}startWorkout(PRE[d.v].day,d.v);VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();ensureAudio();break;
 case 'todayTpl':S.dayOverride='tpl:'+d.v;save();VIEW='today';try{window.scrollTo(0,0)}catch(e){}render();toast(PRE[d.v].n+' set for today');break;
 case 'addTpl':{if(!c){toast('Start a workout first');break}const have=new Set(c.ex.map(x=>x.id));const add=buildTplPlan(d.v).filter(p=>!have.has(p.id));add.forEach(p=>c.ex.push(makeExLog(p)));save();closeSheet();render();toast(add.length?'Added '+add.length+' exercises':'Already in this workout');if(add.length)setTimeout(()=>{const el=$('#ex'+(c.ex.length-add.length));el&&el.scrollIntoView({behavior:'smooth'})},50);break}
 case 'allTips':sheet(`<h3>Coach tips</h3><div class="xs mut">Rules run on your own logs on this phone — not a live AI.</div>${coachTips().map(tipHtml).join('')}<button class="btn-big" data-act="closeSheet" style="margin-top:8px">Close</button>`);break;
 case 'progTab':progTab=d.v;PT_PICK=1;render();break;
 case 'metric':progMetric=d.v;render();break;
 case 'bwAdd':{const el2=$('#bwIn');const v=parseFloat(el2&&el2.value);if(!(v>0)||v>1500){toast('Enter your weight in '+unit());break}const t=Date.now(),day0=new Date(t).toDateString();S.body=(S.body||[]).filter(b=>new Date(b.t).toDateString()!==day0);S.body.push({t,w:Math.round(v*10)/10});S.body.sort((a,b)=>a.t-b.t);save();render();toast('Saved '+fmtW(v)+' '+unit());break}
 case 'bwDel':if(confirm('Delete this bodyweight entry?')){S.body=(S.body||[]).filter(b=>String(b.t)!==d.v);save();render()}break;
 }
}
function importData(txt){const o=JSON.parse(txt);if(!o||!Array.isArray(o.workouts))throw new Error('Not a Lift Coach backup');S=migrate(Object.assign(defaults(o.noSeed),o,{settings:Object.assign(defaults(o.noSeed).settings,o.settings||{})}));save();}
document.addEventListener('click',ev=>{if(ev.target.closest&&ev.target.closest('a.howto'))return;const el=ev.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;if(el.id==='sheetBg'&&ev.target!==el)return;try{act(el.dataset.act,el.dataset,el)}catch(e){showErr(e);try{render()}catch(_){}}});
document.addEventListener('change',ev=>{try{onChange(ev)}catch(e){showErr(e)}});
function onChange(ev){const el=ev.target;const d=el.dataset;
 if(d.act==='inp'&&S.current){const s=S.current.ex[+d.ei].sets[+d.si];const v=parseFloat(el.value);if(!isNaN(v)){if(d.f==='w'){s.w=Math.max(0,v);S.current.ex[+d.ei].sets.forEach((x,i)=>{if(i>+d.si&&!x.done)x.w=s.w})}else s.r=Math.max(0,Math.round(v))}save();render()}
 else if(d.act==='cdSel'&&S.current){S.current.cd.type=el.value;save();render()}
 else if(d.act==='cdInp'&&S.current){S.current.cd[d.k]=el.value;save()}
 else if(d.act==='ctNum'&&S.current){const v=parseInt(el.value);if(v>0){S.current.ct[d.k]=v;S.current.ct.acc=0;S.current.ct.run=false;save();render()}}
 else if(d.act==='placeSel'){PLSEL[d.k]=el.value;render()}
 else if(d.act==='cardioMin'&&S.current){const v=parseInt(el.value);S.current.cardio=v>0?v:null;save()}
 else if(d.act==='startW'){const v=parseFloat(el.value);if(isNaN(v))delete S.startW[d.id];else S.startW[d.id]=v;save()}
 else if(d.act==='incSel'){S.incOv[d.id]=parseFloat(el.value);save()}
 else if(d.act==='progSel'){progEx=el.value;render()}
 else if(d.act==='volSel'){volMus=el.value;render()}
 else if(d.act==='tog'){S.settings[d.v]=el.checked;if(d.v==='game'&&el.checked){S.game=S.game||{};S.game.seenLv=gameLedger().lv.l}if(d.v==='backFriendly'&&el.checked){S.settings.limits=S.settings.limits||{};S.settings.limits.back=true}save();render()}
 else if(d.act==='setSel'){if(d.v==='age'&&!el.value)delete S.settings.age;else S.settings[d.v]=el.value;save();render()}
 else if(d.act==='hTog'){const h=S.settings.homeEq=S.settings.homeEq||{bench:'none'};h[d.v]=el.checked;S.dayOverride=null;save();render()}
 else if(d.act==='hSel'){const h=S.settings.homeEq=S.settings.homeEq||{};h[d.k]=el.value;save();render()}
 else if(d.act==='hNum'){const h=S.settings.homeEq=S.settings.homeEq||{};const v=parseFloat(el.value);h[d.k]=v>0?v:0;save();render()}
 else if(d.act==='limTog'){const L=S.settings.limits=S.settings.limits||{};if(el.checked)L[d.v]=true;else delete L[d.v];if(d.v==='back')S.settings.backFriendly=el.checked;save();render()}
 else if(el.id==='importFile'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{if(confirm('Replace current data with this backup?')){importData(fr.result);render();toast('Imported '+S.workouts.length+' workouts')}}catch(e){toast('Import failed: '+e.message)}el.value=''};fr.readAsText(el.files[0])}}
document.addEventListener('focusin',e=>{if(e.target.dataset&&e.target.dataset.act==='inp')setTimeout(()=>e.target.select(),0)});
setInterval(()=>{const el=$('#elapsed');if(el&&S.current)el.textContent=Math.floor((Date.now()-S.current.start)/60000)},15000);
